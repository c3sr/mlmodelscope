name: mlmodelscope-frontend

services:
  explanation-api:
    build:
      context: ./explanation-api
    env_file:
      - path: ./explanation-api/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      CORS_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${EXPLANATION_API_PORT:-8090}:8090
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://api.local.mlmodelscope.org}
        REACT_APP_COMPANION_URL: ${REACT_APP_COMPANION_URL:-}
        REACT_APP_EXPLANATION_API_URL: ${REACT_APP_EXPLANATION_API_URL:-http://localhost:8090}
        REACT_APP_SITE_TITLE: ${REACT_APP_SITE_TITLE:-MLModelScope}
        REACT_APP_TRACE_URL: ${REACT_APP_TRACE_URL:-}
        REACT_APP_VERSION: ${REACT_APP_VERSION:-local}
    depends_on:
      - explanation-api
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-3000}:80
    restart: unless-stopped
